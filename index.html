 if(y<H*1.2){hin.style.translate=`0 ${y*.25}px`;hin.style.opacity=Math.max(0,1-y/(H*.8));room.style.scale=1+y*.0004;mas.style.translate=`0 ${y*.35}px`}
 h2s.forEach(h=>{const r=h.getBoundingClientRect();if(r.bottom<0||r.top>H)return;h.style.translate=`${(r.top+r.height/2-H/2)*-.08}px 0`});
 covers.forEach(c=>{const r=c.parentNode.getBoundingClientRect();if(r.bottom<0||r.top>H)return;c.style.translate=`0 ${(r.top+r.height/2-H/2)*-.06}px`});
 const t=tl.getBoundingClientRect();tl.style.setProperty("--tp",Math.min(100,Math.max(0,(H*.6-t.top)/t.height*100))+"%")};
addEventListener("scroll",()=>{if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});upd()}
/* Form opens the visitor's email app; no fake success message */
$("#form").onsubmit=e=>{e.preventDefault();const f=e.target,m=$("#fmsg");
 if(!f.name.value.trim()||!/^\S+@\S+\.\S+$/.test(f.email.value)||!f.message.value.trim()){m.textContent="Please fill in name, a valid email and a message.";m.style.color="#FFB4B4";return}
 if(CONFIG.email.includes("example.com")){m.textContent="Set your real email in CONFIG.email first.";m.style.color="#FFB4B4";return}
 const su=encodeURIComponent("Portfolio message from "+f.name.value),bd=encodeURIComponent(f.message.value+"\n\n— "+f.name.value+" ("+f.email.value+")"),to=encodeURIComponent(CONFIG.email);
 const g="https://mail.google.com/mail/?view=cm&fs=1&to="+to+"&su="+su+"&body="+bd,mt="mailto:"+CONFIG.email+"?subject="+su+"&body="+bd;
 const w=window.open(g,"_blank");if(w)w.opener=null;
 m.style.color="var(--lime)";m.textContent="Gmail should open in a new tab with your message ready. Press Send there to deliver it. If nothing opened:";
 [["Open Gmail",g,"_blank"],["Use my email app",mt,"_self"]].forEach(([t,h,tg])=>{const a=document.createElement("a");a.textContent=t;a.href=h;a.target=tg;a.rel="noopener";a.style.cssText="color:#fff;margin-left:10px;text-decoration:underline";m.append(a)})};
</script>
